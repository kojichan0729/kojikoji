<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ORGANISM LAB</title><style>
:root{--bg:#fff;--fg:#111;--mu:#666;--ln:#ccc;--sf:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--mu:#999;--ln:#444;--sf:#1c1c1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--mu:#999;--ln:#444;--sf:#1c1c1c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding:8px 12px}
h1{font-size:15px;margin:0 0 6px}h3{font-size:13px;margin:14px 0 4px;border-bottom:1px solid var(--ln)}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);padding:2px 8px;border-radius:0}
button{cursor:pointer}button.on{background:var(--fg);color:var(--bg)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:2px 6px;text-align:left;vertical-align:top}
tr[data-a]{cursor:pointer}tr.sel{background:var(--sf)}
.r{display:flex;gap:8px;align-items:center}.l{width:90px}.b{flex:1;height:8px;background:var(--sf);border:1px solid var(--ln)}.b i{display:block;height:100%;background:var(--fg)}
.mu{color:var(--mu)}canvas{width:100%;height:120px;display:block}textarea{width:100%;height:120px;box-sizing:border-box}
</style></head><body>
<h1>ORGANISM LAB　<span class="mu">フェーズ1-5: 内部モデル・表情・音声・視覚</span></h1>
<div id="hd"></div><div id="nav" style="margin:6px 0"></div><div id="main" class="sc"></div>
<script>
const $=s=>document.querySelector(s),cl=(x,a=0,b=100)=>Math.max(a,Math.min(b,x)),f1=x=>(+x).toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=[['hunger','空腹'],['thirst','喉の渇き'],['fatigue','疲労'],['sleep','睡眠欲求'],['stress','ストレス'],['health','健康状態'],['comfort','快適度'],['temp','体温相当'],['energy','エネルギー'],['pain','痛み相当'],['isolation','孤立度'],['social','社会的欲求']];
const E=[['joy','喜び'],['sadness','悲しみ'],['anger','怒り'],['fear','恐怖'],['disgust','嫌悪'],['surprise','驚き'],['relief','安心'],['curiosity','好奇心'],['boredom','退屈'],['lonely','孤独'],['confusion','混乱'],['anticipation','期待'],['disappoint','失望'],['trust','信頼'],['attach','愛着'],['anxiety','不安'],['achieve','達成感'],['irritation','苛立ち']];
const LBL={};[...P,...E].forEach(([k,n])=>LBL[k]=n);
const INIT={hunger:20,thirst:20,fatigue:10,sleep:10,stress:10,health:100,comfort:80,temp:50,energy:90,pain:0,isolation:20,social:30};
const ST={food:{n:'食物',p:{hunger:-35,energy:12},e:{joy:20,relief:15}},water:{n:'水',p:{thirst:-40},e:{relief:15}},
loud:{n:'大きな音',p:{stress:15},e:{fear:35,surprise:40,anxiety:15}},voice:{n:'穏やかな声',p:{stress:-10,isolation:-15,social:-5},e:{trust:12,relief:10,attach:6}},
obj:{n:'未知の物体',p:{},e:{curiosity:30,surprise:15}},soft:{n:'やさしい接触',p:{stress:-12,isolation:-20},e:{trust:15,attach:10,relief:10}},
hard:{n:'強い接触',p:{pain:35,stress:18,health:-5},e:{fear:30,anger:15}},cold:{n:'低温',p:{temp:-18,stress:8},e:{anxiety:10}},warm:{n:'適温',p:{temp:15},e:{relief:8}}};
const AN={approach:'接近',avoid:'回避',observe:'観察',explore:'探索',rest:'休息',vocalize:'発声',attend:'注目',react:'刺激への反応',respond:'他者への反応',idle:'何もしない'};
const RATE={lonely:.01,trust:.005,attach:.005};
let S,db=null,cur=null,ui={tab:'obs',sel:'hunger',speed:1,run:true,list:[],cf:0,out:''};
function mk(init,names){const o={};for(const[k]of names){const v=init[k]||0;o[k]={v,pv:v,ref:v,d:0,r:'初期値',hist:[],_r:[],rs:{}}}return o}
function newState(id,name){return{id,name,created:Date.now(),t:0,phys:mk(INIT,P),emo:mk({},E),mem:{stm:[],epi:[],assoc:{}},act:{cur:'idle',scores:[],why:'初期状態'},lastStim:null,sinceStim:99,emoEv:[],acts:[],log:[],stimN:0}}
function slog(lv,m){if(!S)return;S.log.push({t:S.t,lv,m});if(S.log.length>300)S.log.shift()}
function bump(g,k,d,r){const o=S[g][k];o.v=cl(o.v+d);if(Math.abs(d)>=.4){o._r.push(r+' '+(d>0?'+':'')+f1(d));if(cur){o.rs[cur]=(o.rs[cur]||0)+1}}}
function comfortFn(){const g=k=>S.phys[k].v;return cl(100-(g('stress')*.3+g('pain')*.3+g('hunger')*.15+g('thirst')*.1+g('fatigue')*.1+Math.max(0,Math.abs(g('temp')-50)-10)*.5))}
const effic=()=>Math.max(.2,1-S.phys.fatigue.v/120-S.phys.stress.v/300);
function present(id){const s=ST[id],M=S.mem.assoc,a=M[id]||(M[id]={n:0,pred:0,emo:{},str:1,first:S.t,last:S.t});cur=id;
const c0=comfortFn(),e0={};for(const k in S.emo)e0[k]=S.emo[k].v;const h=1/(1+.4*a.n),tag=a.n?'(慣れ '+f1(h)+')':'(初見)';
if(a.pred>=3)bump('emo','anticipation',a.pred*2,'過去の経験から良い結果を予測('+f1(a.pred)+')');
if(a.pred<=-3){bump('emo','fear',-a.pred*1.5,'過去の経験から悪い結果を予測('+f1(a.pred)+')');bump('emo','anxiety',-a.pred,'悪い結果の予測')}
for(const k in s.p)bump('phys',k,s.p[k],s.n+'の提示');
for(const k in s.e)bump('emo',k,s.e[k]*h,s.n+tag);
const out=comfortFn()-c0,pe=out-a.pred;
if(Math.abs(pe)>=3){bump('emo','surprise',Math.min(40,Math.abs(pe)*2),'予測誤差 '+f1(pe));if(pe<0)bump('emo','disappoint',Math.min(40,-pe*1.5),'結果が予測を下回った');else{bump('emo','joy',pe,'結果が予測を上回った');bump('emo','achieve',pe*.5,'予測より良い結果')}}
if(out>3){bump('emo','trust',out*.5,s.n+'で快適度が上昇');bump('emo','attach',out*.3,s.n+'との良い経験')}
a.pred+=.3*effic()*pe;a.n++;a.last=S.t;a.str=Math.min(1,a.str+.3);
for(const k in S.emo){const d=S.emo[k].v-e0[k];if(Math.abs(d)>=5)a.emo[k]=+((a.emo[k]||0)*.7+d*.3).toFixed(1)}
const top=Object.entries(S.emo).sort((x,y)=>y[1].v-x[1].v).slice(0,3).map(x=>x[0]);
S.mem.stm.push({t:S.t,stim:id,out:+f1(out),pe:+f1(pe)});if(S.mem.stm.length>20)S.mem.stm.shift();
if(Math.abs(out)>=3||Math.abs(pe)>=3){S.mem.epi.push({t:S.t,stim:id,out:+f1(out),pe:+f1(pe),top,act:S.act.cur,str:1});if(S.mem.epi.length>200){S.mem.epi.sort((x,y)=>y.str-x.str);S.mem.epi.length=200;S.mem.epi.sort((x,y)=>x.t-y.t)}}
S.lastStim=id;S.sinceStim=0;S.stimN++;slog('STIM',s.n+' 結果 '+f1(out)+' 予測誤差 '+f1(pe));cur=null;decide();render()}
function decide(){const e=k=>S.emo[k].v,p=k=>S.phys[k].v,ls=S.sinceStim<10?S.lastStim:null,a=ls?S.mem.assoc[ls]:null,pr=a?a.pred:0,nv=a?1/(1+.4*a.n):0,L=ls?1:0,so=ls=='voice'||ls=='soft'?1:0;
const C={approach:[['予測された快',pr*1.2*L],['好奇心',e('curiosity')*.3*L],['信頼',e('trust')*.2*L],['恐怖',-e('fear')*.5],['疲労',-p('fatigue')*.2]],
avoid:[['恐怖',e('fear')*.6],['痛み',p('pain')*.5],['予測された不快',Math.max(0,-pr)*1.5*L]],
observe:[['好奇心',e('curiosity')*.4],['新奇性',nv*20*L],['恐怖',e('fear')*.1]],
explore:[['好奇心',e('curiosity')*.3],['退屈',e('boredom')*.6],['疲労',-p('fatigue')*.4],['恐怖',-e('fear')*.4],['エネルギー',(p('energy')-50)*.2]],
rest:[['疲労',p('fatigue')*.6],['睡眠欲求',p('sleep')*.5],['刺激直後',S.sinceStim<3?-20:0]],
vocalize:[['孤独',e('lonely')*.5],['空腹',p('hunger')*.2],['渇き',p('thirst')*.2],['痛み',p('pain')*.3],['不安',e('anxiety')*.2]],
attend:[['驚き',e('surprise')*.5],['新奇性',nv*15*L]],react:[['刺激直後',S.sinceStim<2?25:0],['驚き',e('surprise')*.2]],
respond:[['他者の刺激',so*20],['信頼',e('trust')*.2*so],['孤立度',p('isolation')*.2*so]],idle:[['基準',15]]};
const lim=p('health')<30;if(lim)for(const k of Object.keys(C))if(!['rest','idle','vocalize'].includes(k))delete C[k];
const sc=Object.entries(C).map(([k,t])=>{if(k==S.act.cur)t=t.concat([['継続',5]]);return{k,t,total:t.reduce((s,x)=>s+x[1],0)}}).sort((x,y)=>y.total-x.total),w=sc[0];
const why=w.t.slice().sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,3).map(x=>x[0]+(x[1]>=0?'+':'')+f1(x[1])).join(', ')+(lim?' (健康低下により行動制限)':'');
if(w.k!=S.act.cur){S.acts.push({t:S.t,k:w.k,why});if(S.acts.length>200)S.acts.shift();slog('ACT',AN[w.k]+' : '+why)}S.act={cur:w.k,scores:sc,why}}
function tick(){S.t++;S.sinceStim++;const p=S.phys,b=bump,rs=S.act.cur=='rest',ac=S.act.cur;
b('phys','hunger',.15,'時間経過');b('phys','thirst',.2,'時間経過');
if(rs){b('phys','fatigue',-.8,'休息');b('phys','sleep',-.6,'休息');b('phys','stress',-.2,'休息');b('phys','energy',.1,'休息中の回復')}else{b('phys','fatigue',.1+(ac=='explore'?.2:0),'活動');b('phys','sleep',.08,'覚醒の持続')}
b('phys','energy',-.08*(rs?.3:1)-(p.hunger.v>70?.1:0),'代謝');
if(p.hunger.v>60)b('phys','stress',.1*(p.hunger.v-60)/40+.05,'空腹の持続');if(p.thirst.v>60)b('phys','stress',.1*(p.thirst.v-60)/40+.05,'渇きの持続');if(p.fatigue.v>70)b('phys','stress',.05,'高い疲労');
b('phys','isolation',rs?.01:.05,'他者刺激なし');b('phys','social',(p.isolation.v-p.social.v)*.02,'孤立度に追従');
if(p.hunger.v>85||p.thirst.v>85||p.energy.v<10)b('phys','health',-.2,'欠乏');else if(p.comfort.v>60)b('phys','health',.03,'回復');
b('phys','pain',-p.pain.v*.03,'自然回復');b('phys','temp',(50-p.temp.v)*.01,'恒常性');b('phys','comfort',(comfortFn()-p.comfort.v)*.2,'内部状態の総合');
for(const[k]of E)b('emo',k,-S.emo[k].v*(RATE[k]||.04),'自然減衰');
const g=k=>p[k].v;if(g('hunger')>50){b('emo','irritation',(g('hunger')-50)*.01,'空腹');b('emo','anxiety',(g('hunger')-50)*.005,'空腹')}
if(g('stress')>50)b('emo','anxiety',(g('stress')-50)*.01,'ストレス');if(g('isolation')>50)b('emo','lonely',(g('isolation')-50)*.02,'孤立度');
if(S.sinceStim>30){b('emo','boredom',.3,'刺激なし');b('emo','curiosity',-.05,'刺激なし')}if(g('fatigue')>70)b('emo','irritation',.1,'疲労');
if(g('health')<40)b('emo','sadness',.1,'健康状態の低下');if(g('comfort')>75)b('emo','relief',.05,'快適度が高い');
if(ac=='observe'){b('emo','boredom',-.3,'観察');b('emo','curiosity',-.15,'観察で好奇心が満たされる')}
if(ac=='explore'){b('emo','boredom',-.5,'探索');b('phys','energy',-.15,'探索');b('emo','curiosity',-.1,'探索')}
if(ac=='vocalize'){b('emo','lonely',-.2,'発声');b('phys','energy',-.05,'発声')}
const M=S.mem;for(const k in M.assoc){const a=M.assoc[k];a.str=Math.max(.01,a.str*.9995)}for(const x of M.epi)x.str=rs?Math.min(1,x.str+.002):Math.max(.01,x.str*.999);
for(const gr of['phys','emo'])for(const k in S[gr]){const o=S[gr][k];o.d=o.v-o.ref;o.pv=o.ref;o.ref=o.v;if(o._r.length){o.r=o._r.slice(-3).join(' / ');o._r=[]}
o.hist.push([S.t,+f1(o.v)]);if(o.hist.length>600)o.hist.shift();
if(gr=='emo'){if(o.v>20&&!o.since){o.since=S.t;o.peak=o.v;o.sr=o.r}else if(o.since){o.peak=Math.max(o.peak,o.v);if(o.v<=20){S.emoEv.push({k,s:o.since,dur:S.t-o.since,peak:+f1(o.peak),r:o.sr});if(S.emoEv.length>200)S.emoEv.shift();o.since=null}}}}
decide()}
const row=(k,o)=>`<div class="r"><span class="l">${LBL[k]}</span><span class="b"><i style="width:${o.v}%"></i></span><span>${f1(o.v)}</span></div>`;
function chart(id,ser){const c=document.getElementById(id);if(!c)return;const x=c.getContext('2d'),w=c.width=c.clientWidth||600,h=c.height=120,st=getComputedStyle(document.documentElement);
x.strokeStyle=st.getPropertyValue('--ln');x.strokeRect(.5,.5,w-1,h-1);ser.forEach((s,i)=>{x.strokeStyle=st.getPropertyValue('--fg');x.setLineDash([[],[4,3],[1,3],[8,3,2,3],[2,2]][i%5]);x.beginPath();s.forEach((p,j)=>{const X=j/Math.max(1,s.length-1)*(w-4)+2,Y=h-2-p[1]/100*(h-4);j?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()})}
let post=[];
const V={
obs(){const top=Object.entries(S.emo).sort((a,b)=>b[1].v-a[1].v).slice(0,5);return`<h3>刺激の提示</h3><p>${Object.entries(ST).map(([k,s])=>`<button data-a="stim" data-v="${k}">${s.n}</button>`).join(' ')}</p>
<h3>現在の行動</h3><p><b>${AN[S.act.cur]}</b>　理由: ${esc(S.act.why)}</p><h3>主要な感情</h3>${top.map(([k,o])=>row(k,o)).join('')}
<h3>生理状態</h3>${P.map(([k])=>row(k,S.phys[k])).join('')}`},
state(){const o=S.phys[ui.sel]||S.emo[ui.sel],all=[...P,...E];post.push(()=>chart('c1',[o.hist]));
const ep=S.mem.epi.filter(e=>e.top.includes(ui.sel)).slice(-5);
return`<table><tr><th>変数</th><th>現在値</th><th>直前</th><th>変化量</th><th>変化した理由</th></tr>${all.map(([k,n])=>{const x=S.phys[k]||S.emo[k];return`<tr data-a="sel" data-v="${k}" class="${k==ui.sel?'sel':''}"><td>${n}</td><td>${f1(x.v)}</td><td>${f1(x.pv)}</td><td>${x.d>=0?'+':''}${f1(x.d)}</td><td class="mu">${esc(x.r)}</td></tr>`}).join('')}</table>
<h3>詳細: ${LBL[ui.sel]}</h3><p>現在値 ${f1(o.v)} / 直前 ${f1(o.pv)} / 変化量 ${f1(o.d)}<br>理由: ${esc(o.r)}</p><canvas id="c1"></canvas>
<p>関連する刺激: ${Object.entries(o.rs).sort((a,b)=>b[1]-a[1]).map(([k,n])=>ST[k].n+' ('+n+'回)').join(', ')||'なし'}</p>
<p>関連する記憶(エピソード): ${ep.map(e=>'t='+e.t+' '+ST[e.stim].n+' 結果'+e.out).join(' / ')||'なし'}</p>`},
emo(){const sorted=Object.entries(S.emo).sort((a,b)=>b[1].v-a[1].v),t4=sorted.slice(0,4);post.push(()=>chart('c2',t4.map(x=>x[1].hist)));
return`${sorted.map(([k,o])=>row(k,o)).join('')}<h3>上位4感情の推移 (${t4.map((x,i)=>LBL[x[0]]+':線種'+(i+1)).join(' ')})</h3><canvas id="c2"></canvas>
<h3>感情イベント (20超で開始・20以下で終了)</h3><table><tr><th>感情</th><th>開始t</th><th>継続</th><th>最大値</th><th>発生理由</th></tr>${S.emoEv.slice(-15).reverse().map(e=>`<tr><td>${LBL[e.k]}</td><td>${e.s}</td><td>${e.dur}</td><td>${e.peak}</td><td class="mu">${esc(e.r||'')}</td></tr>`).join('')}</table>`},
mem(){const m=S.mem;return`<h3>短期記憶 (直近20)</h3><table><tr><th>t</th><th>刺激</th><th>結果(快適度差)</th><th>予測誤差</th></tr>${m.stm.slice().reverse().map(x=>`<tr><td>${x.t}</td><td>${ST[x.stim].n}</td><td>${x.out}</td><td>${x.pe}</td></tr>`).join('')}</table>
<h3>連想記憶 (刺激と結果・感情の関連)</h3><table><tr><th>刺激</th><th>経験回数</th><th>予測される結果</th><th>強さ</th><th>区分</th><th>関連する感情変化</th></tr>${Object.entries(m.assoc).map(([k,a])=>`<tr><td>${ST[k].n}</td><td>${a.n}</td><td>${f1(a.pred)}</td><td>${a.str.toFixed(2)}</td><td>${a.n>=3?'長期':'短期'}</td><td class="mu">${Object.entries(a.emo).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,4).map(([e,v])=>LBL[e]+' '+v).join(', ')}</td></tr>`).join('')}</table>
<h3>エピソード記憶 (直近15 / 最大200 / 休息で定着)</h3><table><tr><th>t</th><th>刺激</th><th>結果</th><th>予測誤差</th><th>主要感情</th><th>行動</th><th>強さ</th></tr>${m.epi.slice(-15).reverse().map(x=>`<tr><td>${x.t}</td><td>${ST[x.stim].n}</td><td>${x.out}</td><td>${x.pe}</td><td>${x.top.map(k=>LBL[k]).join(',')}</td><td>${AN[x.act]}</td><td>${x.str.toFixed(2)}</td></tr>`).join('')}</table>`},
act(){return`<p>現在: <b>${AN[S.act.cur]}</b></p><table><tr><th>候補</th><th>合計</th><th>内訳</th></tr>${S.act.scores.map(s=>`<tr><td>${AN[s.k]}</td><td>${f1(s.total)}</td><td class="mu">${s.t.filter(x=>Math.abs(x[1])>=.05).map(x=>x[0]+' '+f1(x[1])).join(', ')}</td></tr>`).join('')}</table>
<h3>行動履歴</h3><table><tr><th>t</th><th>行動</th><th>理由</th></tr>${S.acts.slice(-15).reverse().map(a=>`<tr><td>${a.t}</td><td>${AN[a.k]}</td><td class="mu">${esc(a.why)}</td></tr>`).join('')}</table>`},
log(){return`<table>${S.log.slice().reverse().map(l=>`<tr><td>${l.t}</td><td>${l.lv}</td><td>${esc(l.m)}</td></tr>`).join('')}</table>`},
data(){return`<p>${db?'保存先: IndexedDB (状態・記憶・時系列を別ストアに分離)　最終保存: '+(ui.saved||'未')+'　自動保存10秒毎':'<b>IndexedDBが使えないため、保存されません</b>'}</p>
<p><button data-a="save">手動保存</button> <button data-a="bak">バックアップ作成</button> <button data-a="rst">最新バックアップから復元</button> <button data-a="wipe">${ui.cf?'もう一度押すと初期化':'この個体を初期化'}</button></p>

function vRes(r){const V=VS(),now=Date.now(),c=ui.cam;if(!c)return;c.n=(c.n||0)+1;c.ms=c.ms==null?r.ms:c.ms*.9+r.ms*.1;const face=ui.fbx||r.face;(ui.vr||(ui.vr=[])).push([now,r.bri,...r.rgb,r.cchg,r.mot,r.mx,r.my,r.mdx,r.mdy,r.area,r.bb?(r.bb[0]+r.bb[2])/2:null,r.bb?(r.bb[1]+r.bb[3])/2:null,r.skin,r.person?1:0,face?1:0,r.ms].map(v=>typeof v=='number'?+v.toFixed(4):v));if(ui.vr.length>3000)ui.vr.shift();let evn=false;if(r.ev=='appear'&&r.sig){const q=vClass(r.sig);V.cur=q.c.id;V.ev.push({t:S.t,ty:'出現',cid:q.c.id,nw:q.nw,a:+r.area.toFixed(3),p:r.person?1:0,f:face?1:0});if(q.nw){bump('emo','surprise',10,'視覚: 未知の概念V#'+q.c.id);bump('emo','curiosity',10,'視覚: 未知の概念')}slog('VIS','物体出現 V#'+q.c.id+(q.nw?' (新規)':' ('+q.c.n+'回目)'));present('obj');evn=true}if(r.ev=='disappear'){const k=V.cl.find(x=>x.id==V.cur);V.ev.push({t:S.t,ty:'消失',cid:V.cur});if(k&&k.n>=3)bump('emo','surprise',10,'視覚: 慣れた物体の消失');V.cur=null;slog('VIS','物体消失');evn=true}if(V.ev.length>200)V.ev.shift();vAtt(r,face);if(ui.tab!='vision'||!ui.fb)return;const o=el('xo');if(o){const g=o.getContext('2d');g.clearRect(0,0,320,240);const bx=(x,y,w,h)=>{g.lineWidth=3;g.strokeStyle='#000';g.strokeRect(x,y,w,h);g.lineWidth=1;g.strokeStyle='#fff';g.strokeRect(x,y,w,h)};if(r.bb)bx(r.bb[0]*320,r.bb[1]*240,(r.bb[2]-r.bb[0])*320,(r.bb[3]-r.bb[1])*240);if(face)bx(face[0]*320-14,face[1]*240-14,28,28);const a=ui.at;if(a&&a.x!=null){g.strokeStyle='#fff';g.beginPath();g.arc(a.x*320,a.y*240,10,0,6.3);g.stroke()}}const dir=Math.abs(r.mdx)+Math.abs(r.mdy)>.01?(r.mdy>0?'下':'上')+(r.mdx>0?'右':'左')+' ('+r.mdx.toFixed(2)+','+r.mdy.toFixed(2)+')':'-',f2=v=>v==null?'-':v.toFixed(2),cur=V.cl.find(q=>q.id==V.cur),a=ui.at||{};el('xl').innerHTML=[['明るさ',f2(r.bri)],['平均色RGB',r.rgb.map(v=>v.toFixed(0)).join(', ')],['色相分布(8分割)',r.hue.map(v=>v.toFixed(2)).join(' ')],['色の変化',f2(r.cchg)],['動き量(画面比)',f2(r.mot)],['動きの重心',r.mx==null?'-':f2(r.mx)+', '+f2(r.my)],['動きの方向(重心移動・近似)',dir],['静止領域の割合',f2(r.stat)],['前景物体 位置/面積',r.bb?f2((r.bb[0]+r.bb[2])/2)+', '+f2((r.bb[1]+r.bb[3])/2)+' / '+f2(r.area):'なし'],['人物らしい領域(近似)',r.person?'あり':'なし'],['顔らしい領域('+(ui.fbx?'FaceDetector':'肌色近似')+')',face?f2(face[0])+', '+f2(face[1]):'なし'],['現在の視覚概念',cur?'V#'+cur.id+' ('+cur.n+'回)':'なし'],['注目対象',(a.target||'なし')+(a.since?' ('+((Date.now()-a.since)/1000).toFixed(1)+'秒)':'')],['注目理由',a.why||'-'],['解析 処理ms/ドロップ',(c.ms||0).toFixed(1)+' / '+(ui.vd||0)+' (記録'+ui.vr.length+'行)']].map(q=>'<tr><td>'+q[0]+'</td><td>'+q[1]+'</td></tr>').join('');if(c.n%5==0){const w=ui.vr.slice(-300);chart('xc',[w.map((q,i)=>[i,q[1]*100]),w.map((q,i)=>[i,Math.min(100,q[6]*400)])])}if(evn||c.n%25==0)vVT()}
function vVT(){const d=el('xt');if(!d)return;const V=VS(),W=LG().w,f=v=>(+v).toFixed(2);d.innerHTML='<h3>視覚概念(前景物体の特徴から自動形成)</h3><table><tr><th>ID</th><th>回数</th><th>初出t</th><th>最終t</th><th>色比R,G,B</th><th>面積</th><th>縦横比</th><th>明度</th><th>関連語(聞いた回数)</th></tr>'+V.cl.map(c=>'<tr><td>V#'+c.id+'</td><td>'+c.n+'</td><td>'+c.t0+'</td><td>'+(c.t1||'-')+'</td><td>'+c.c.slice(0,3).map(f).join(', ')+'</td><td>'+f(c.c[3])+'</td><td>'+f(c.c[4]*2)+'</td><td>'+f(c.c[5])+'</td><td>'+esc(Object.entries(W).filter(e=>e[1].vc&&e[1].vc[c.id]).sort((a,b)=>b[1].vc[c.id]-a[1].vc[c.id]).slice(0,3).map(e=>e[0]+'('+e[1].vc[c.id]+')').join(', '))+'</td></tr>').join('')+'</table><h3>出現・消失イベント(直近10)</h3><table><tr><th>t</th><th>種別</th><th>概念</th><th>新規</th><th>面積</th></tr>'+V.ev.slice(-10).reverse().map(e=>'<tr><td>'+e.t+'</td><td>'+e.ty+'</td><td>'+(e.cid?'V#'+e.cid:'-')+'</td><td>'+(e.nw?'新規':'-')+'</td><td>'+(e.a||'-')+'</td></tr>').join('')+'</table><h3>注目履歴(1秒以上・直近10)</h3><table><tr><th>t</th><th>対象</th><th>継続(秒)</th><th>理由</th></tr>'+V.att.slice(-10).reverse().map(a=>'<tr><td>'+a.t+'</td><td>'+a.tg+'</td><td>'+a.dur+'</td><td class="mu">'+esc(a.why)+'</td></tr>').join('')+'</table>'}

if(ui.tab=='data')return;if(['face','voice','vision'].includes(ui.tab)){if(!ui.fb){$('#main').innerHTML=V[ui.tab]();ui.fb=1;if(ui.tab=='face')faceList();else if(ui.tab=='voice')vInit();else xInit()}return}post=[];$('#main').innerHTML=V[ui.tab]();post.forEach(f=>f())}

function split(s){const o=JSON.parse(JSON.stringify(s)),ser={id:s.id,h:{},emoEv:o.emoEv,acts:o.acts,log:o.log};for(const g of['phys','emo'])for(const k in o[g]){ser.h[k]=o[g][k].hist;delete o[g][k].hist}const mem={id:s.id,mem:o.mem,voice:o.voice,lang:o.lang,vis:o.vis};delete o.mem;delete o.voice;delete o.lang;delete o.vis;delete o.emoEv;delete o.acts;delete o.log;o.savedAt=Date.now();return{org:o,mem,series:ser}}
function join(r){const s=r.org;s.mem=r.mem.mem;s.voice=r.mem.voice;s.lang=r.mem.lang;s.vis=r.mem.vis;s.emoEv=r.series.emoEv||[];s.acts=r.series.acts||[];s.log=r.series.log||[];for(const g of['phys','emo'])for(const k in s[g]){s[g][k].hist=r.series.h[k]||[];s[g][k]._r=s[g][k]._r||[];s[g][k].rs=s[g][k].rs||{}}return s}
